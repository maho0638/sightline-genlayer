name: Sightline Studionet Proof

on:
  push:
    paths:
      - "contracts/**"
      - "tests/integration/test_sightline_studionet.py"
      - ".github/workflows/studionet.yml"
  workflow_dispatch:

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run canonical Sightline live proof
        run: gltest tests/integration/test_sightline_studionet.py -v -s --network studionet
